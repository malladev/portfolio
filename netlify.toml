[build]
  command = "pnpm run build"
  publish = "build"

# Serverless functions (the contact form sends its emails from here)
[functions]
  directory = "netlify/functions"

# Node.js and PNPM version (Netlify will use .nvmrc if present, but this is a backup)
[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "12"

# Headers are configured in public/_headers
# Sitemap is in public/sitemap.xml
